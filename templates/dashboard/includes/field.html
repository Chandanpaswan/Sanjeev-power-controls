{% if field.field.widget.input_type == 'checkbox' %}
<div class="check-field{% if field.errors %} has-error{% endif %}">
  <label class="form-check">
    {{ field }}
    <span class="form-check-label">
      <strong>{{ field.label }}</strong>
      {% if field.help_text %}<span>{{ field.help_text }}</span>{% endif %}
    </span>
  </label>
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
{% else %}
<div class="field{% if field.field.widget.input_type == 'textarea' or field.field.widget.allow_multiple_selected %} field--full{% endif %}{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<span class="hint">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
{% endif %}
