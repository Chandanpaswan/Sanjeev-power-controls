{% extends "base.html" %}
{% block title %}Seller Registration — Sanjeev Power Controls{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:700px;">
    <h1 class="section__title">Seller Registration</h1>
    <p class="section__lead">Apply for seller account. Approval required.</p>
    <form method="post" enctype="multipart/form-data" class="card" style="padding:2rem;">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn--primary">Submit Application</button>
    </form>
  </div>
</section>
{% endblock %}
