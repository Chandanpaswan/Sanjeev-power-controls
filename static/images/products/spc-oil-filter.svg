<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative render of a spin-on diesel engine oil filter</title>
  <desc id="desc">Studio-style illustration of a blue spin-on oil filter with a domed top, white label band and threaded base. Illustrative product visual, not a photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#EEF3F8"/>
      <stop offset="1" stop-color="#E3EAF2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0B1F3A" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A2A4D"/>
      <stop offset="0.14" stop-color="#164E8A"/>
      <stop offset="0.42" stop-color="#2E6DA8"/>
      <stop offset="0.62" stop-color="#1A548F"/>
      <stop offset="1" stop-color="#092642"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A2A4D"/>
      <stop offset="0.35" stop-color="#2966A0"/>
      <stop offset="0.65" stop-color="#164E8A"/>
      <stop offset="1" stop-color="#092642"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F8FB"/>
      <stop offset="0.4" stop-color="#BAC6D3"/>
      <stop offset="0.6" stop-color="#E9EEF4"/>
      <stop offset="1" stop-color="#8E9DAD"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE4EC"/>
      <stop offset="0.25" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#C7D2DE"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#0B1F3A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <ellipse cx="400" cy="500" rx="210" ry="34" fill="#0B1F3A" opacity="0.1"/>

  <g filter="url(#shadow)">
    <path d="M298 214c0-34 46-58 102-58s102 24 102 58v188H298Z" fill="url(#body)"/>
    <path d="M298 214c0-34 46-58 102-58s102 24 102 58" fill="url(#dome)"/>
    <ellipse cx="400" cy="214" rx="102" ry="30" fill="url(#dome)"/>
    <ellipse cx="400" cy="193" rx="56" ry="16" fill="#0A2A4D"/>
    <ellipse cx="400" cy="191" rx="56" ry="15" fill="none" stroke="#3B6FA5" stroke-width="1.5"/>
    <rect x="380" y="182" width="40" height="8" rx="4" fill="#0B1F3A"/>
    <rect x="384" y="184" width="32" height="3" rx="1.5" fill="#64748B" opacity="0.7"/>

    <rect x="298" y="246" width="204" height="118" fill="url(#label)"/>
    <rect x="298" y="246" width="204" height="4" fill="#D92332"/>
    <rect x="298" y="360" width="204" height="4" fill="#D92332"/>
    <circle cx="400" cy="305" r="26" fill="#0B1F3A"/>
    <path d="M408 290l-14 20h9l-4 18 15-22h-9Z" fill="#D92332"/>
    <circle cx="400" cy="305" r="26" fill="none" stroke="#164E8A" stroke-width="2" stroke-opacity="0.25"/>
    <path d="M331 305h30M439 305h30" stroke="#0B1F3A" stroke-width="2" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M331 318h18M451 318h18" stroke="#0B1F3A" stroke-width="2" stroke-opacity="0.12" stroke-linecap="round"/>

    <path d="M298 366h204v24c0 12-46 22-102 22s-102-10-102-22Z" fill="url(#body)"/>
    <rect x="300" y="394" width="200" height="10" fill="#07182D" opacity="0.5"/>

    <rect x="316" y="404" width="168" height="38" rx="6" fill="url(#metal)"/>
    <ellipse cx="400" cy="442" rx="84" ry="17" fill="#93A2B2"/>
    <ellipse cx="400" cy="438" rx="84" ry="17" fill="url(#metal)"/>
    <ellipse cx="400" cy="438" rx="56" ry="11" fill="#64748B"/>
    <ellipse cx="400" cy="438" rx="56" ry="11" fill="none" stroke="#E9EEF4" stroke-width="1"/>
    <ellipse cx="400" cy="438" rx="34" ry="7" fill="#1E293B"/>
    <g stroke="#0B1F3A" stroke-opacity="0.25" stroke-width="1.2">
      <path d="M352 431l-8 1M448 431l8 1M348 438h-8M452 438h8M356 445l-8-1M444 445l8-1"/>
    </g>
    <ellipse cx="400" cy="438" rx="18" ry="4" fill="#0B1F3A" opacity="0.5"/>
  </g>

  <rect x="310" y="238" width="8" height="150" rx="4" fill="#FFFFFF" opacity="0.16"/>
  <rect x="478" y="238" width="8" height="150" rx="4" fill="#0B1F3A" opacity="0.12"/>
</svg>
